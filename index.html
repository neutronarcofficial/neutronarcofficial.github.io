<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeutronArc</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #011046;
    --fg: #f4f6fb;
    --muted: #8a93a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  main {
    text-align: center;
    max-width: 420px;
  }
  img {
    width: min(70vw, 280px);
    height: auto;
    display: block;
    margin: 0 auto 20px;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0;
  }
</style>
</head>
<body>
  <main>
    <img src="logo.png" alt="NeutronArc">
    <p>Apps and games. More on the way.</p>
  </main>
</body>
</html>
