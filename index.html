<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeutronArc</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --fg: #f4f6fb;
    --accent: #5b8cff;
    --muted: #8a93a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  main {
    text-align: center;
    max-width: 480px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 2.75rem);
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  h1 span { color: var(--accent); }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0;
  }
</style>
</head>
<body>
  <main>
    <h1>Neutron<span>Arc</span></h1>
    <p>Apps and games. More on the way.</p>
  </main>
</body>
</html>
